# Checks that the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets work.
# Prints only pass/fail: this repo is public, so its Actions logs are public.
name: verify cloudflare token
on:
  workflow_dispatch:
  push:
    branches: [ops/verify-token]
    paths: [".github/workflows/verify-cloudflare-token.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token and account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          [ -n "$CF_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          ok() { curl -s -H "Authorization: Bearer $CF_TOKEN" "$1" | jq -r '.success'; }
          user=$(ok "https://api.cloudflare.com/client/v4/user/tokens/verify")
          acct=$(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify")
          echo "token valid (user token): $user"
          echo "token valid (account token): $acct"
          [ "$user" = "true" ] || [ "$acct" = "true" ] || { echo "Token is not valid"; exit 1; }
          echo "Workers API reachable: $(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts")"
          echo "D1 API reachable: $(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database")"
          echo "R2 API reachable: $(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets")"
