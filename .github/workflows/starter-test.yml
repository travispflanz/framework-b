# Builds the starter with the current core, runs its end-to-end test in a real browser, then the QA gate,
# twice: as a static site, and with client editing (EmDash) switched on.
# Local Worker, local D1 and R2, Turnstile test keys, no email, no Cloudflare account access.
name: starter tests
on:
  pull_request:
    paths: ["starter/**", "packages/core/**", "scripts/vendor-core.mjs", ".github/workflows/starter-test.yml"]
  push:
    branches-ignore: [main]
    paths: ["starter/**", "packages/core/**", "scripts/vendor-core.mjs", ".github/workflows/starter-test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        editing: ['off', 'on']
    name: e2e (editing ${{ matrix.editing }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/.node-version
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - run: node scripts/vendor-core.mjs starter
      - run: npm ci
        working-directory: starter
      - run: npx playwright install --with-deps chromium
        working-directory: starter
      - name: Script tests (Access headers reach only the checked host)
        if: matrix.editing == 'off'
        run: node --test scripts/test/*.test.mjs
        working-directory: starter
      - name: Switch client editing on
        if: matrix.editing == 'on'
        run: |
          node scripts/editing.mjs on
          node scripts/fill-test-placeholders.mjs
        working-directory: starter
      - name: Style tiles and judge ballots (two drafts; a low-contrast third must be rejected)
        run: |
          mkdir -p "$RUNNER_TEMP/drafts"
          cp DESIGN.md "$RUNNER_TEMP/drafts/a.md"
          sed 's/^  accent: .*/  accent: "#7a3b16"/' DESIGN.md > "$RUNNER_TEMP/drafts/b.md"
          sed 's/^  ink: .*/  ink: "#d0d0d0"/' DESIGN.md > "$RUNNER_TEMP/drafts/c.md"
          node scripts/design-tiles.mjs "$RUNNER_TEMP/drafts/a.md" "$RUNNER_TEMP/drafts/b.md" "$RUNNER_TEMP/drafts/c.md" --out "$RUNNER_TEMP/tiles" || { for f in "$RUNNER_TEMP"/tiles/*/build.log; do echo "== $f"; grep -v "^\s*at " "$f" | tail -n 40; done; exit 1; }
          jq -e '[.[] | select(.ok)] | length == 2' "$RUNNER_TEMP/tiles/tiles.json"
          jq -e '.[] | select(.name == "c") | (.ok | not) and (.why | test("contrast"))' "$RUNNER_TEMP/tiles/tiles.json"
          for f in a b; do test -s "$RUNNER_TEMP/tiles/$f/tile-1280.png" && test -s "$RUNNER_TEMP/tiles/$f/tile-390.png"; done
          node scripts/design-judge.mjs prepare --tiles "$RUNNER_TEMP/tiles" --out "$RUNNER_TEMP/judge"
          jq -e '.ballots | length == 2' "$RUNNER_TEMP/judge/ballot.json"
        working-directory: starter
      - name: This-or-that pairs (four pairs on the real hero; a font fetched from Fontsource)
        if: matrix.editing == 'off'
        run: |
          cat > "$RUNNER_TEMP/pairs.json" <<'EOF'
          { "pairs": [
            { "id": "type", "question": "Which headline?", "recommended": "a", "a": { "label": "Serif", "display": "Lora" }, "b": { "label": "Sans", "display": "Figtree" } },
            { "id": "palette", "question": "Which colours?", "recommended": "b", "a": { "label": "Green", "colors": { "accent": "#1d5c3a" } }, "b": { "label": "Rust", "colors": { "bg": "#faf6ef", "accent": "#9a3b16" } } },
            { "id": "density", "question": "Roomy or compact?", "recommended": "a", "a": { "label": "Roomy", "density": "airy" }, "b": { "label": "Compact", "density": "compact" } },
            { "id": "shape", "question": "Soft or square?", "recommended": "a", "a": { "label": "Soft", "radius": 12 }, "b": { "label": "Square", "radius": 0 } }
          ] }
          EOF
          node scripts/design-pairs.mjs render --pairs "$RUNNER_TEMP/pairs.json" --out "$RUNNER_TEMP/pairs"
          for p in type palette density shape; do test -s "$RUNNER_TEMP/pairs/$p.png"; done
          test ! -e design/intake.json
        working-directory: starter
      - name: Full-site fixture (extra page, hero image, text and image, gallery, credits)
        if: matrix.editing == 'off'
        run: node scripts/test/fixture-full-site.mjs
        working-directory: starter
      - run: npm run build
        working-directory: starter
      - run: npm run test:e2e
        working-directory: starter
      - run: npm run qa
        working-directory: starter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-output-editing-${{ matrix.editing }}
          path: starter/qa-output/
          retention-days: 14
