# Reusable: the template self-test against the real account. Creates a throwaway idea site
# (selftest-<run id>, Turnstile test keys), runs the QA gate on its live URL, sends one lead with a
# file and checks it in D1 and R2, checks a preview branch through Access, then always tears the site down.
# Runs twice in parallel: as a static site created from a kickoff brief, and with client editing (EmDash) on
# created from plain inputs. Called only from the owner's
# private ops repo, which holds the secrets.
name: site selftest
on:
  workflow_call:
    inputs:
      framework_repo: { type: string, required: true }
      framework_ref: { type: string, default: main }
      owner_email: { type: string, required: true }
    secrets:
      CLOUDFLARE_API_TOKEN: { required: true }
      CLOUDFLARE_ACCOUNT_ID: { required: true }
      CF_BUILDS_TOKEN: { required: true }
      GH_SITES_TOKEN: { required: true }
      UPTIMEROBOT_API_KEY: { required: false }
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        editing: ['off', 'on']
    name: selftest (editing ${{ matrix.editing }})
    concurrency: site-selftest-${{ matrix.editing }}
    env:
      SITE_ID: selftest-${{ github.run_id }}-${{ matrix.editing == 'on' && 'ed' || 'st' }}
      EDITING: ${{ matrix.editing }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_BUILDS_TOKEN: ${{ secrets.CF_BUILDS_TOKEN }}
      GH_SITES_TOKEN: ${{ secrets.GH_SITES_TOKEN }}
      UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.framework_repo }}
          ref: ${{ inputs.framework_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/.node-version
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - name: Write a kickoff brief (static leg)
        if: matrix.editing == 'off'
        run: |
          jq -nc --arg id "$SITE_ID" --arg email "${{ inputs.owner_email }}" '{version: 1,
            business: {id: $id, name: "Selftest Example Co", offer: "A throwaway site that proves the framework works."},
            owner: {email: $email}, editing: false, indexing: false, inferred: ["business.offer"]}' > brief.json
          node scripts/site/brief.mjs check brief.json
          echo "BRIEF=$(cat brief.json)" >> "$GITHUB_ENV"
      - name: Create the site
        env:
          SITE_NAME: Selftest Example Co
          SITE_TAGLINE: A throwaway site that proves the framework works.
          OWNER_EMAIL: ${{ inputs.owner_email }}
          TURNSTILE_MODE: test
          SUMMARY_FILE: site-summary.json
        run: node scripts/site/create.mjs
      - name: Read the summary
        id: site
        run: |
          echo "url=$(node -p 'require("./site-summary.json").url')" >> "$GITHUB_OUTPUT"
          echo "dir=$(node -p 'require("./site-summary.json").dir')" >> "$GITHUB_OUTPUT"
      # The QA gate and the live lead run from the site's own folder, with its own config.
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: ${{ steps.site.outputs.dir }}
      - name: QA gate on the live site
        run: npm run qa -- --url "${{ steps.site.outputs.url }}"
        working-directory: ${{ steps.site.outputs.dir }}
      - name: Send a live lead with a file
        run: npm run test:live-lead -- --url "${{ steps.site.outputs.url }}" --out "$GITHUB_WORKSPACE/live-lead.json"
        working-directory: ${{ steps.site.outputs.dir }}
      - name: Check the uptime monitors
        if: env.UPTIMEROBOT_API_KEY != ''
        run: node scripts/site/verify-monitors.mjs "$(node -p 'new URL(require("./site-summary.json").url).host')"
      - name: Check client editing (EmDash)
        if: matrix.editing == 'on'
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node scripts/site/verify-editing.mjs
      - name: Check the lead in D1 and R2
        env:
          LEAD_FILE: live-lead.json
        run: node scripts/site/verify-lead.mjs
      - name: Check a preview branch through Access
        working-directory: ${{ steps.site.outputs.dir }}
        run: |
          git checkout -q -b selftest/preview
          printf '\nPreview check %s\n' "${{ github.run_id }}" >> README.md
          git -c user.name="Framework B" -c user.email="framework-b@users.noreply.github.com" commit -q -am "Self-test preview"
          owner=$(curl -s -H "Authorization: Bearer $GH_SITES_TOKEN" https://api.github.com/user | jq -r .login)
          git push -q "https://x-access-token:${GH_SITES_TOKEN}@github.com/${owner}/site-${SITE_ID}.git" selftest/preview
          node "$GITHUB_WORKSPACE/scripts/site/preview-check.mjs" --site . --site-id "$SITE_ID" --branch selftest/preview --commit "$(git rev-parse HEAD)" --report "$GITHUB_WORKSPACE/preview-report.md"
      - name: Tear the site down
        if: always()
        run: node scripts/site/teardown.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ github.run_id }}-editing-${{ matrix.editing }}
          path: |
            site-summary.json
            preview-report.md
            ${{ steps.site.outputs.dir }}/qa-output/
          if-no-files-found: ignore
          retention-days: 14
