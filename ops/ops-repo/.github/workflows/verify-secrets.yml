name: verify secrets
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every secret (pass/fail only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_TOKEN: ${{ secrets.D1_BACKUP_TOKEN }}
          BUILDS_TOKEN: ${{ secrets.CF_BUILDS_TOKEN }}
          GH_TOKEN_SITES: ${{ secrets.GH_SITES_TOKEN }}
          UR_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_ADMIN_KEY }}
          MAILER_URL: ${{ secrets.MAILER_URL }}
          MAILER_SECRET: ${{ secrets.MAILER_SECRET }}
        run: |
          API=https://api.cloudflare.com/client/v4
          ok() { curl -s -H "Authorization: Bearer $1" "$2" | jq -r 'if .success then "true" else "false (" + ([.errors[]? | "\(.code) \(.message)"] | join("; ")) + ")" end'; }
          echo "deploy token valid: $(ok "$CF_TOKEN" "$API/accounts/$CF_ACCOUNT/tokens/verify")"
          # The token's ID (not its value) identifies it on the account's API tokens page.
          echo "deploy token id: $(curl -s -H "Authorization: Bearer $CF_TOKEN" "$API/accounts/$CF_ACCOUNT/tokens/verify" | jq -r '.result.id')"
          echo "deploy token -> Workers: $(ok "$CF_TOKEN" "$API/accounts/$CF_ACCOUNT/workers/scripts")"
          echo "deploy token -> D1: $(ok "$CF_TOKEN" "$API/accounts/$CF_ACCOUNT/d1/database")"
          echo "deploy token -> R2: $(ok "$CF_TOKEN" "$API/accounts/$CF_ACCOUNT/r2/buckets")"
          echo "deploy token -> Turnstile: $(ok "$CF_TOKEN" "$API/accounts/$CF_ACCOUNT/challenges/widgets")"
          echo "deploy token -> Access apps: $(ok "$CF_TOKEN" "$API/accounts/$CF_ACCOUNT/access/apps")"
          echo "deploy token -> Workers KV (EmDash sessions): $(ok "$CF_TOKEN" "$API/accounts/$CF_ACCOUNT/storage/kv/namespaces")"
          # Service tokens: create a ten-minute probe token (the minimum) and delete it straight away (an empty request body
          # also creates a token, so there is no side-effect-free probe). Nameless tokens left by an earlier
          # version of this check are removed too. Token values are never printed.
          ST="$API/accounts/$CF_ACCOUNT/access/service_tokens"
          probe=$(curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" -d '{"name":"framework-b verify probe","duration":"10m"}' "$ST")
          pid=$(echo "$probe" | jq -r '.result.id // empty')
          if [ -n "$pid" ]; then
            del=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$ST/$pid")
            echo "deploy token -> Access service tokens (create + delete): true (delete HTTP $del)"
          else
            echo "deploy token -> Access service tokens (create + delete): false ($(echo "$probe" | jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")'))"
          fi
          for id in $(curl -s -H "Authorization: Bearer $CF_TOKEN" "$ST" | jq -r '.result[]? | select((.name // "") == "") | .id'); do
            echo "removed a nameless service token left by an earlier check: HTTP $(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CF_TOKEN" "$ST/$id")"
          done
          echo "service tokens in the account: $(curl -s -H "Authorization: Bearer $CF_TOKEN" "$ST" | jq -r '[.result[]? | .name] | join(", ")')"
          echo "d1 backup token valid: $(ok "$D1_TOKEN" "$API/accounts/$CF_ACCOUNT/tokens/verify")"
          echo "d1 backup token -> D1: $(ok "$D1_TOKEN" "$API/accounts/$CF_ACCOUNT/d1/database")"
          echo "builds token valid (user token): $(ok "$BUILDS_TOKEN" "$API/user/tokens/verify")"
          echo "builds token -> Builds API: $(ok "$BUILDS_TOKEN" "$API/accounts/$CF_ACCOUNT/builds/tokens")"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN_SITES" https://api.github.com/user)
          echo "github sites token -> /user: HTTP $code"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN_SITES" "https://api.github.com/repos/${{ github.repository }}")
          echo "github sites token -> this private repo: HTTP $code"
          # Optional secrets. Each is reported as "not set" when missing; values are never printed.
          if [ -n "$UR_KEY" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $UR_KEY" https://api.uptimerobot.com/v3/alert-contacts)
            echo "uptimerobot key -> alert contacts (main key needed to create monitors): HTTP $code"
          else echo "uptimerobot key: not set (sites get no monitors)"; fi
          if [ -n "$RESEND_KEY" ]; then
            # Listing domains needs a full-access key; a sending-only key is refused.
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $RESEND_KEY" https://api.resend.com/domains)
            echo "resend admin key -> domains (full access): HTTP $code"
          else echo "resend admin key: not set (launch sites get no auto-replies, newsletter or drips)"; fi
          # The mailer is not called here, because a call sends an email; the site mailer workflow tests it.
          echo "mailer url: $([ -n "$MAILER_URL" ] && echo set || echo 'not set (idea sites get no notifications)')"
          echo "mailer secret: $([ -n "$MAILER_SECRET" ] && echo set || echo 'not set')"
