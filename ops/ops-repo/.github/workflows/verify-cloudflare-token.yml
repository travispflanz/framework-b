name: verify cloudflare token
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token and account
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok() { curl -s -H "Authorization: Bearer $CF_TOKEN" "$1" | jq -r '.success'; }
          echo "account token valid: $(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify")"
          echo "Workers: $(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts")"
          echo "D1: $(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/d1/database")"
          echo "R2: $(ok "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets")"
